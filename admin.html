<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b14">
<title>Rumbo UX · Control de acceso</title>
<link rel="icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>
:root{--bg:#070b14;--ink:#f4efe6;--mute:rgba(244,239,230,.55);--gold:#d9b77e;--gold2:#f0d6a6;--hair:rgba(217,183,126,.18);--sage:#9cc5a1;--terra:#de8f7b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#14223d 0%,var(--bg) 60%) fixed;color:var(--ink);font:15px/1.5 Manrope,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
header img{width:44px;height:44px;border-radius:12px}
h1{font:350 26px Fraunces,serif}
.k{font:500 10px "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h2{font:500 11px "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:30px 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:linear-gradient(165deg,#13203a,#0c1525);box-shadow:0 0 0 1px var(--hair) inset;border-radius:16px;padding:16px 18px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
.code{font:500 18px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--gold2)}
.small{font-size:12.5px;color:var(--mute)}
button,select,input{font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);background:#0f1a2e;border:0;
  box-shadow:0 0 0 1px rgba(217,183,126,.3) inset;border-radius:11px;height:38px;padding:0 14px;cursor:pointer}
input{text-transform:none;letter-spacing:.02em;font:500 14px Manrope,sans-serif;color:var(--ink);cursor:text}
input[type=number]{width:70px;text-align:center}
button.ok{color:var(--sage);box-shadow:0 0 0 1px rgba(156,197,161,.4) inset}
button.ko{color:var(--terra);box-shadow:0 0 0 1px rgba(222,143,123,.35) inset}
.tag{font:500 10px "JetBrains Mono",monospace;letter-spacing:.14em;padding:3px 8px;border-radius:20px;box-shadow:0 0 0 1px var(--hair) inset;color:var(--mute)}
.empty{color:var(--mute);font-size:13.5px;padding:6px 2px}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2a48;padding:10px 18px;border-radius:12px;box-shadow:0 0 0 1px var(--hair) inset;opacity:0;transition:opacity .3s;font-size:14px}
#msg.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <header><img src="iconos/icono-192.png" alt=""><div><h1>Rumbo UX</h1><div class="k">Control de acceso</div></div></header>

  <section id="login" class="card">
    <p style="margin-bottom:14px">Entra con tu cuenta de Google de administrador.</p>
    <button id="btnLogin">Entrar con Google</button>
  </section>

  <section id="panel" class="hide">
    <div class="row small"><span class="grow" id="who"></span><button id="btnOut">Salir</button></div>

    <h2>Personas y códigos de acceso</h2>
    <p class="small" style="margin:-4px 2px 14px">Da a cada persona su código. Lo escribe una vez en la app y entra; si lo usa en más dispositivos de los permitidos, el más antiguo deja de funcionar.</p>
    <div id="pers"></div>
    <div class="card row">
      <input class="grow" id="newName" placeholder="Nueva persona (p. ej. Borja)" maxlength="40">
      <input type="number" id="newMax" value="1" min="1" max="10" title="Dispositivos a la vez">
      <button id="btnAddP">Añadir</button>
    </div>
    <div id="legacy"></div>

    <h2>Clave de cifrado</h2>
    <div class="card">
      <p class="small" id="keyState">Comprobando…</p>
      <div class="row hide" id="keyRow" style="margin-top:10px"><input class="grow" id="keyIn" placeholder="Pega aquí el contenido de herramientas/clave.txt"><button id="btnKey">Guardar clave</button></div>
    </div>
  </section>
</main>
<div id="msg"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = t => { const m = $("msg"); m.textContent = t; m.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove("on"), 2600); };
const when = ts => ts ? ts.toDate().toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const devName = ua => /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Dispositivo";
const show = c => c ? c.replace(/^([A-Z]+)([A-Z0-9]{6})$/, "$1-$2") : "";
function newCode(nombre) {
  const base = (nombre || "X").normalize("NFD").replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 8) || "RUMBO";
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(6));
  return base + Array.from(r, x => A[x % 32]).join("");
}

firebase.initializeApp(window.RUMBO_FB);
const auth = firebase.auth(), db = firebase.firestore();
let devices = [], personas = [], activos = {};

$("btnLogin").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast("No se pudo entrar: " + e.code));
$("btnOut").onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  const admin = u && !u.isAnonymous;
  $("login").classList.toggle("hide", !!admin); $("panel").classList.toggle("hide", !admin);
  if (!admin) return;
  $("who").textContent = u.email;
  const err = e => toast("Sin permiso de administrador (" + e.code + ")");
  db.collection("devices").onSnapshot(s => { devices = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err);
  db.collection("personas").onSnapshot(s => { personas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre)); render(); }, err);
  db.collection("activos").onSnapshot(s => { activos = {}; s.docs.forEach(d => activos[d.id] = d.data().uids || []); render(); }, err);
  db.doc("config/key").get().then(d => {
    $("keyState").innerHTML = d.exists ? 'Clave instalada ✓ No hay que volver a pegarla. <a href="#" id="keyChg" style="color:var(--gold)">Cambiar</a>' : "Falta instalar la clave: sin ella nadie puede abrir la app.";
    $("keyRow").classList.toggle("hide", d.exists);
    const c = $("keyChg"); if (c) c.onclick = e => { e.preventDefault(); $("keyRow").classList.remove("hide"); };
  }).catch(e => { $("keyState").textContent = "No se pudo leer la clave (" + e.code + ")."; $("keyRow").classList.remove("hide"); });
});

function render() {
  $("pers").innerHTML = personas.length ? personas.map(p => {
    const ids = activos[p.id] || [], ds = ids.map(id => devices.find(d => d.id === id) || { id }).reverse();
    return `<div class="card">
      <div class="row"><div class="grow" style="font:350 22px Fraunces,serif">${esc(p.nombre)}</div>
        <span class="small">Dispositivos a la vez</span><input type="number" min="1" max="10" value="${p.max}" onchange="setMax('${p.id}',this.value)">
        <button class="ko" onclick="removePerson('${p.id}')">Eliminar</button></div>
      <div class="row" style="margin-top:14px">
        ${p.codigo ? `<div class="grow"><div class="k" style="margin-bottom:4px">Código de acceso</div><span class="code" style="font-size:22px">${show(p.codigo)}</span></div>
          <button onclick="copyCode('${p.id}')">Copiar</button><button onclick="regen('${p.id}')">Nuevo código</button>`
        : `<div class="grow small">Sin código todavía.</div><button class="ok" onclick="regen('${p.id}')">Generar código</button>`}
      </div>
      ${ds.length ? ds.map((d, i) => `<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)">
          <div class="grow"><span style="font-weight:600">${devName(d.ua || "")}</span>
          <span class="small"> · activado ${when(d.creado)} · última conexión ${when(d.visto || d.creado)}</span></div>
          <button class="ko" onclick="revoke('${p.id}','${d.id}')">Revocar</button></div>`).join("")
        : `<div class="empty" style="margin-top:10px">Ningún dispositivo activo.</div>`}
    </div>`;
  }).join("") : `<div class="empty">Todavía no hay personas.</div>`;
  const old = devices.filter(d => !d.codigo);
  $("legacy").innerHTML = old.length ? `<div class="card row" style="margin-top:6px"><div class="grow small">${old.length} autorización(es) del sistema anterior, ya sin uso.</div>
    <button onclick="cleanLegacy()">Borrar</button></div>` : "";
}

async function regen(pid) {
  const p = personas.find(x => x.id === pid);
  if (p.codigo && !confirm(`¿Crear un código nuevo para ${p.nombre}? El actual dejará de funcionar y sus dispositivos tendrán que escribir el nuevo.`)) return;
  const code = newCode(p.nombre), b = db.batch();
  if (p.codigo) b.delete(db.doc("codigos/" + p.codigo));
  b.set(db.doc("codigos/" + code), { persona: pid, max: p.max || 1 });
  b.update(db.doc("personas/" + pid), { codigo: code });
  if (p.codigo) b.set(db.doc("activos/" + pid), { uids: [] });
  await b.commit(); toast("Código: " + show(code));
}
async function copyCode(pid) {
  const p = personas.find(x => x.id === pid);
  try { await navigator.clipboard.writeText(show(p.codigo)); toast("Código copiado"); } catch (e) { prompt("Copia el código:", show(p.codigo)); }
}
async function setMax(pid, v) {
  const p = personas.find(x => x.id === pid), max = Math.max(1, Math.min(10, +v || 1)), ids = activos[pid] || [];
  const b = db.batch();
  b.update(db.doc("personas/" + pid), { max });
  if (p.codigo) b.set(db.doc("codigos/" + p.codigo), { persona: pid, max });
  if (ids.length > max) b.set(db.doc("activos/" + pid), { uids: ids.slice(-max) });
  await b.commit(); toast("Guardado");
}
async function revoke(pid, id) {
  if (!confirm("¿Revocar este dispositivo? Se bloqueará en cuanto se conecte (o como máximo en 15 días sin conexión). Podrá volver a entrar con el código.")) return;
  const b = db.batch();
  b.set(db.doc("activos/" + pid), { uids: (activos[pid] || []).filter(x => x !== id) });
  b.delete(db.doc("devices/" + id));
  await b.commit(); toast("Revocado");
}
async function removePerson(pid) {
  const p = personas.find(x => x.id === pid), ds = devices.filter(d => d.persona === pid);
  if (!confirm(`¿Eliminar a ${p.nombre}? Su código dejará de funcionar y sus dispositivos perderán el acceso.`)) return;
  const b = db.batch();
  ds.forEach(d => b.delete(db.doc("devices/" + d.id)));
  if (p.codigo) b.delete(db.doc("codigos/" + p.codigo));
  b.delete(db.doc("activos/" + pid)); b.delete(db.doc("personas/" + pid));
  await b.commit(); toast("Eliminada");
}
async function cleanLegacy() {
  const b = db.batch(); devices.filter(d => !d.codigo).forEach(d => b.delete(db.doc("devices/" + d.id)));
  await b.commit(); toast("Hecho");
}
$("btnAddP").onclick = async () => {
  const n = $("newName").value.trim(); if (!n) return;
  const max = Math.max(1, Math.min(10, +$("newMax").value || 1)), ref = db.collection("personas").doc(), code = newCode(n), b = db.batch();
  b.set(ref, { nombre: n, max, codigo: code });
  b.set(db.doc("codigos/" + code), { persona: ref.id, max });
  b.set(db.doc("activos/" + ref.id), { uids: [] });
  await b.commit(); $("newName").value = ""; toast("Código de " + n + ": " + show(code));
};
$("btnKey").onclick = async () => {
  const k = $("keyIn").value.trim();
  if (!/^[A-Za-z0-9+/]{43}=$/.test(k)) return toast("La clave no tiene el formato correcto");
  try { await db.doc("config/key").set({ k }); } catch (e) { return toast("No se pudo guardar: " + e.code); }
  $("keyIn").value = ""; $("keyRow").classList.add("hide"); $("keyState").textContent = "Clave instalada ✓ No hay que volver a pegarla."; toast("Clave guardada");
};
</script>
</body>
</html>
