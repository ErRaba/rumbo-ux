<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b14">
<title>Rumbo UX · Control de acceso</title>
<link rel="icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>
:root{--bg:#070b14;--ink:#f4efe6;--mute:rgba(244,239,230,.55);--gold:#d9b77e;--gold2:#f0d6a6;--hair:rgba(217,183,126,.18);--sage:#9cc5a1;--terra:#de8f7b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#14223d 0%,var(--bg) 60%) fixed;color:var(--ink);font:15px/1.5 Manrope,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
header img{width:44px;height:44px;border-radius:12px}
h1{font:350 26px Fraunces,serif}
.k{font:500 10px "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h2{font:500 11px "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:30px 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:linear-gradient(165deg,#13203a,#0c1525);box-shadow:0 0 0 1px var(--hair) inset;border-radius:16px;padding:16px 18px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
.code{font:500 18px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--gold2)}
.small{font-size:12.5px;color:var(--mute)}
button,select,input{font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);background:#0f1a2e;border:0;
  box-shadow:0 0 0 1px rgba(217,183,126,.3) inset;border-radius:11px;height:38px;padding:0 14px;cursor:pointer}
input{text-transform:none;letter-spacing:.02em;font:500 14px Manrope,sans-serif;color:var(--ink);cursor:text}
input[type=number]{width:70px;text-align:center}
button.ok{color:var(--sage);box-shadow:0 0 0 1px rgba(156,197,161,.4) inset}
button.ko{color:var(--terra);box-shadow:0 0 0 1px rgba(222,143,123,.35) inset}
.tag{font:500 10px "JetBrains Mono",monospace;letter-spacing:.14em;padding:3px 8px;border-radius:20px;box-shadow:0 0 0 1px var(--hair) inset;color:var(--mute)}
.empty{color:var(--mute);font-size:13.5px;padding:6px 2px}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2a48;padding:10px 18px;border-radius:12px;box-shadow:0 0 0 1px var(--hair) inset;opacity:0;transition:opacity .3s;font-size:14px}
#msg.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <header><img src="iconos/icono-192.png" alt=""><div><h1>Rumbo UX</h1><div class="k">Control de acceso</div></div></header>

  <section id="login" class="card">
    <p style="margin-bottom:14px">Entra con tu cuenta de Google de administrador.</p>
    <button id="btnLogin">Entrar con Google</button>
  </section>

  <section id="panel" class="hide">
    <div class="row small"><span class="grow" id="who"></span><button id="btnOut">Salir</button></div>

    <h2>Solicitudes pendientes <span class="tag" id="nPend">0</span></h2>
    <div id="pend"></div>

    <h2>Personas y dispositivos autorizados</h2>
    <div id="pers"></div>
    <div class="card row">
      <input class="grow" id="newName" placeholder="Nueva persona (p. ej. Borja)" maxlength="40">
      <input type="number" id="newMax" value="1" min="1" max="10" title="Dispositivos a la vez">
      <button id="btnAddP">Añadir</button>
    </div>

    <h2>Clave de cifrado</h2>
    <div class="card">
      <p class="small" id="keyState">Comprobando…</p>
      <div class="row" style="margin-top:10px"><input class="grow" id="keyIn" placeholder="Pega aquí el contenido de herramientas/clave.txt"><button id="btnKey">Guardar clave</button></div>
    </div>
  </section>
</main>
<div id="msg"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = t => { const m = $("msg"); m.textContent = t; m.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove("on"), 2600); };
const when = ts => ts ? ts.toDate().toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const devName = ua => /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Dispositivo";

firebase.initializeApp(window.RUMBO_FB);
const auth = firebase.auth(), db = firebase.firestore();
let devices = [], personas = [];

$("btnLogin").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast("No se pudo entrar: " + e.code));
$("btnOut").onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  const admin = u && !u.isAnonymous;
  $("login").classList.toggle("hide", !!admin); $("panel").classList.toggle("hide", !admin);
  if (!admin) return;
  $("who").textContent = u.email;
  db.collection("devices").onSnapshot(s => { devices = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => toast("Sin permiso de administrador"));
  db.collection("personas").onSnapshot(s => { personas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre)); render(); });
  db.doc("config/key").get().then(d => $("keyState").textContent = d.exists ? "Clave instalada ✓ (solo hace falta volver a pegarla si se genera una nueva)" : "Falta instalar la clave: sin ella nadie puede abrir la app.").catch(() => {});
});

function render() {
  const pend = devices.filter(d => !d.ok).sort((a, b) => (b.creado?.seconds || 0) - (a.creado?.seconds || 0));
  $("nPend").textContent = pend.length;
  const opts = personas.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join("");
  $("pend").innerHTML = pend.length ? pend.map(d => `<div class="card row">
      <div class="grow"><div class="code">${esc(d.code)}</div><div class="small">${esc(d.nombre)} · ${devName(d.ua || "")} · ${when(d.creado)}</div></div>
      ${personas.length ? `<select id="sel-${d.id}">${opts}</select><button class="ok" onclick="approve('${d.id}')">Autorizar</button>` : `<span class="small">Crea antes una persona ↓</span>`}
      <button class="ko" onclick="removeDev('${d.id}','¿Rechazar esta solicitud?')">Rechazar</button></div>`).join("")
    : `<div class="empty">No hay solicitudes. Cuando alguien abra la app por primera vez y la pida, aparecerá aquí con su código.</div>`;
  $("pers").innerHTML = personas.length ? personas.map(p => {
    const ds = devices.filter(d => d.ok && d.persona === p.id).sort((a, b) => (a.aprobado?.seconds || 0) - (b.aprobado?.seconds || 0));
    return `<div class="card"><div class="row"><div class="grow" style="font:350 20px Fraunces,serif">${esc(p.nombre)}</div>
        <span class="small">Dispositivos a la vez</span><input type="number" min="1" max="10" value="${p.max}" onchange="setMax('${p.id}',this.value)">
        <button class="ko" onclick="removePerson('${p.id}')">Eliminar</button></div>
        ${ds.length ? ds.map(d => `<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)">
          <div class="grow"><span class="code" style="font-size:14px">${esc(d.code)}</span> <span class="small">· ${devName(d.ua || "")} · última conexión ${when(d.visto || d.aprobado)}</span></div>
          <button class="ko" onclick="removeDev('${d.id}','¿Revocar el acceso de este dispositivo? Se bloqueará en cuanto se conecte (o como máximo en 15 días sin conexión).')">Revocar</button></div>`).join("")
          : `<div class="empty" style="margin-top:8px">Sin dispositivos autorizados.</div>`}</div>`;
  }).join("") : `<div class="empty">Todavía no hay personas.</div>`;
}

async function approve(id) {
  const pid = $("sel-" + id).value, p = personas.find(x => x.id === pid);
  const act = devices.filter(d => d.ok && d.persona === pid).sort((a, b) => (a.aprobado?.seconds || 0) - (b.aprobado?.seconds || 0));
  const excess = act.length - (p.max || 1) + 1;
  if (excess > 0 && !confirm(`${p.nombre} ya tiene ${act.length} dispositivo(s) (máximo ${p.max}). Se revocará${excess > 1 ? "n los " + excess + " más antiguos" : " el más antiguo"}. ¿Continuar?`)) return;
  const b = db.batch();
  act.slice(0, Math.max(0, excess)).forEach(d => b.delete(db.doc("devices/" + d.id)));
  b.update(db.doc("devices/" + id), { ok: true, persona: pid, aprobado: firebase.firestore.FieldValue.serverTimestamp() });
  await b.commit(); toast("Autorizado");
}
async function removeDev(id, q) { if (confirm(q)) { await db.doc("devices/" + id).delete(); toast("Hecho"); } }
async function setMax(id, v) { await db.doc("personas/" + id).update({ max: Math.max(1, Math.min(10, +v || 1)) }); toast("Guardado"); }
async function removePerson(id) {
  const ds = devices.filter(d => d.persona === id);
  if (!confirm(`¿Eliminar a esta persona${ds.length ? " y revocar sus " + ds.length + " dispositivo(s)" : ""}?`)) return;
  const b = db.batch(); ds.forEach(d => b.delete(db.doc("devices/" + d.id))); b.delete(db.doc("personas/" + id)); await b.commit(); toast("Eliminada");
}
$("btnAddP").onclick = async () => {
  const n = $("newName").value.trim(); if (!n) return;
  await db.collection("personas").add({ nombre: n, max: Math.max(1, +$("newMax").value || 1) }); $("newName").value = ""; toast("Persona añadida");
};
$("btnKey").onclick = async () => {
  const k = $("keyIn").value.trim();
  if (!/^[A-Za-z0-9+/]{43}=$/.test(k)) return toast("La clave no tiene el formato correcto");
  await db.doc("config/key").set({ k }); $("keyIn").value = ""; $("keyState").textContent = "Clave instalada ✓"; toast("Clave guardada");
};
</script>
</body>
</html>
